function gig(){if(allHours()+3>hoursCap()){feedback='You need at least three available hours for a gig.';render();return}let cash=R(24,50);game.money+=cash;game.stress=cl(game.stress+2,0,100);note('Completed a one-time neighborhood gig for $'+cash+'.');persist();render()}
function exportSave(){let blob=new Blob([JSON.stringify(game,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='gridiron-life-save.json';a.click();URL.revokeObjectURL(a.href)}function importSave(el){let file=el.files?.[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let g=JSON.parse(r.result);if(g.version!==4||!g.attrs||!g.plan)throw Error('Unsupported save');game=g;schools=g.schools||schools;persist();render()}catch(err){alert('Could not import: '+err.message)}};r.readAsText(file)}
function panel(t,content){return '<section class="panel"><h2>'+t+'</h2>'+content+'</section>'}function stat(label,val){return '<div class="tile"><div class="num">'+e(val)+'</div><small>'+label+'</small></div>'}function rang(label,v,min,max,func,detail=''){return '<div class="line"><span>'+label+'</span><strong>'+v+(detail||'')+'</strong></div><input aria-label="'+e(label)+'" type="range" min="'+min+'" max="'+max+'" value="'+v+'" oninput="'+func+'">'}
function setupScreen(){return '<div class="bar"><div class="logo">GRIDIRON LIFE</div><span class="chip">Version 0.4 · Player Career</span></div><h1>Create your freshman</h1><p class="muted">100 creation points. Every athlete starts with the same budget. Develop your attributes through actual practice and training afterward.</p>'+panel('Identity & family','<label>Player name<input id="name" type="text" value="'+e(draft.name)+'"></label><div class="grid"><label>Position<select id="position" onchange="setDraftPos(this.value)">'+Object.keys(GROUPS).map(p=>'<option '+(p===draft.position?'selected':'')+'>'+p+'</option>').join('')+'</select></label><label>Background<select id="bg">'+BG.map(b=>'<option value="'+b[0]+'" '+(b[0]===draft.bg?'selected':'')+'>'+b[1]+'</option>').join('')+'</select></label></div><label>School assignment<select id="school">'+schools.map((s,i)=>'<option value="'+i+'" '+(i===draft.school?'selected':'')+'>'+s.name+' · '+s.classif+'A · '+s.scheme+'</option>').join('')+'</select></label><div class="grid"><label>Height (inches)<input type="number" id="height" min="58" max="80" value="'+draft.height+'"></label><label>Weight (lbs)<input type="number" id="weight" min="110" max="280" value="'+draft.weight+'"></label></div>')+panel('Allocate attributes','<div class="line"><strong>Creation points used</strong><strong id="spent">0 / 100</strong></div>'+[...ATTRS,'iq','behavior'].map(k=>'<label class="line"><span>'+e(k==='iq'?'Academic intelligence':k==='behavior'?'Behavior / Coachability':k.replace(/\b\w/g,c=>c.toUpperCase()))+'</span><strong id="v_'+k+'">'+(draft.points[k]||50)+'</strong></label><input type="range" id="a_'+k+'" min="'+(['iq','behavior'].includes(k)?35:28)+'" max="'+(['iq','behavior'].includes(k)?85:70)+'" value="'+(['iq','behavior'].includes(k)?50:draft.points[k])+'" oninput="showBudget()">').join('')+'<p class="muted">Your physique and hidden maturation profile may change as you age. No visible potential grade in Player Career.</p><button onclick="start()">Start Freshman Career</button>');}
function showBudget(){let cost=ATTRS.reduce((n,k)=>n+Math.max(0,(+document.getElementById('a_'+k).value)-38),0)+Math.max(0,(+document.getElementById('a_iq').value)-50)+Math.max(0,(+document.getElementById('a_behavior').value)-50);document.getElementById('spent').textContent=cost+' / 100';for(let k of [...ATTRS,'iq','behavior'])document.getElementById('v_'+k).textContent=document.getElementById('a_'+k).value;document.getElementById('spent').style.color=cost>100?'#ff9696':'#f3c771'}function setDraftPos(p){draft.position=p;draft.name=document.getElementById('name').value;draft.bg=document.getElementById('bg').value;draft.school=+document.getElementById('school').value;draft.height=+document.getElementById('height').value;draft.weight=+document.getElementById('weight').value;render()}
function commonHeader(){let d=depth(),ph=PHASES[game.phase];return '<div class="bar"><div><div class="logo">GRIDIRON LIFE</div><small>v0.4 · '+e(ph.name)+' · Year '+game.year+' · Week '+game.week+'</small></div><span class="chip">'+game.grade+'th grade · '+d.level+' '+d.role+'</span></div><h1>'+e(game.name)+' <span class="muted">· '+game.pos+'</span></h1><div class="stats">'+stat('OVR',rating(game.attrs,game.pos))+stat('Morale',Math.round(game.morale))+stat('Fatigue',Math.round(game.fatigue)+'%')+stat('GPA',game.gpa.toFixed(2))+'</div><div class="tabs">'+[['career','Career'],['team','Team'],['develop','Development'],['life','Life'],['history','History']].map(t=>'<button class="'+(tab===t[0]?'active':'')+'" onclick="tab=\''+t[0]+'\';render()">'+t[1]+'</button>').join('')+'</div>'+(feedback?'<div class="notice">'+e(feedback)+'</div>':'')}
function careerScreen(){let d=depth(),ph=PHASES[game.phase],record=game.record;let event=game.scheduledEvent?panel('Important decision','<div class="story"><h3>'+e(game.scheduledEvent.title)+'</h3><p>'+e(game.scheduledEvent.body)+'</p></div>'+game.scheduledEvent.choices.map((c,i)=>'<button class="choice" onclick="chooseEvent('+i+')">'+e(c[0])+'</button>').join('')):'';let gp=game.gamePending?panel('Game Day · Week '+game.week,'<p><strong>'+e(game.school.name)+'</strong> · '+e(d.level)+' · '+e(d.role)+'</p><p>Coach '+e(game.school.coach)+' runs a '+e(game.school.scheme)+' offense ('+Math.round(game.school.runRate*100)+'% run). Current fatigue '+Math.round(game.fatigue)+'%.</p><button onclick="simulateGame()">Simulate This Game</button>'):'<div class="buttons"><button onclick="nextWeek()">'+(game.phase===0?'Advance to Game Day':'Simulate Next Week')+'</button></div>';let last=game.games[0];return event+panel('Your football career','<p>'+e(game.school.name)+' · '+game.school.classif+'A · '+e(ph.name)+' · '+ph.capacity+' discretionary hours/week</p><div class="grid"><div class="tile"><strong>Depth chart: #'+d.rank+'</strong><br><small>'+e(d.role)+' on '+e(d.level)+'</small></div><div class="tile"><strong>Team record: '+record[0]+'–'+record[1]+'</strong><br><small>Coach trust '+Math.round(game.coachTrust)+'/100</small></div></div><p class="muted">'+(game.injury?'Injured: '+game.injury.name+' ('+game.injury.weeks+' week(s) remaining)':'You are medically available.')+'</p>'+gp)+(last?panel('Last game · Week '+last.week,'<h3>'+(last.win?'Win':'Loss')+' '+last.score+'–'+last.opp+'</h3><p>'+last.role+' · '+last.level+' · '+last.stats.carries+' carries, '+last.stats.rushYards+' rush yards, '+last.stats.rushTD+' rush TD; '+last.stats.receptions+' receptions, '+last.stats.recYards+' rec yards, '+last.stats.recTD+' rec TD.</p><details><summary>View your actual play log ('+last.plays.length+' events)</summary>'+(last.plays.length?last.plays.map(x=>'<div class="log">'+e(x)+'</div>').join(''):'<p>No touches this week. The team played without involving you.</p>')+'</details>'):'')+panel('Latest career activity',game.history.slice(0,7).map(h=>'<div class="log"><strong>'+e(h.title)+'</strong><br>'+e(h.text)+'</div>').join(''))}
function teamScreen(){let d=depth(),s=game.school;return panel('Your school','<h3>'+e(s.name)+' · '+s.classif+'A</h3><p>'+e(s.coach)+' · '+e(s.scheme)+' offense · '+e(s.defense)+' defense</p><div class="grid">'+[['Prestige',s.prestige],['Coaching',s.coaching],['Facilities',s.facilities],['Run rate',Math.round(s.runRate*100)+'%'],['Star reliance',s.star+'%'],['Expectations',s.expectations]].map(v=>'<div class="tile"><small>'+v[0]+'</small><div class="num">'+v[1]+'</div></div>').join('')+'</div>')+panel('Position depth chart','<p class="muted">Roster spots are influenced by ability, grades, school level and coaching decisions. Your role is not guaranteed by coach trust.</p><table><thead><tr><th>#</th><th>Player</th><th>Grade</th><th>OVR</th></tr></thead><tbody>'+d.all.map((x,i)=>'<tr'+(x.id==='you'?' style="color:#f3c86e;font-weight:800"':'')+'><td>'+(i+1)+'</td><td>'+e(x.name)+(x.id==='you'?' (YOU)':'')+'</td><td>'+x.grade+'</td><td>'+x.ovr+'</td></tr>').join('')+'</tbody></table>')}
function developScreen(){let ph=PHASES[game.phase];return panel('Weekly availability','<p>Everyone has the same '+ph.capacity+' discretionary hours in '+e(ph.name)+'. Commitments use those hours; morale changes efficiency, not the number of hours.</p><div class="line"><strong>'+allHours()+' / '+hoursCap()+' hours allocated</strong><span class="accent">'+(hoursCap()-allHours())+'h free</span></div>'+Object.entries({training:'Extra training',study:'Studying',work:'Flexible gigs / work',social:'Socializing',recovery:'Dedicated recovery'}).map(([k,label])=>rang(label,game.plan[k],0,hoursCap(),'alloc(\''+k+'\',+this.value)','h')).join('')+(game.job?'<p class="muted">Recurring employment automatically reserves '+game.job.hours+' additional hours weekly.</p>':'') )+panel('Team practice','<p>Mandatory '+ph.teamHours+' hours/week. '+e(game.school.coach)+' chooses the drills; you choose your effort.</p>'+rang('Team practice intensity',game.teamIntensity,0,4,'setIntensity(\'teamIntensity\',+this.value)')+'<small>0 Coasting · 1 Light · 2 Standard · 3 High · 4 Maximum</small>')+panel('Individual training · '+game.plan.training+' hours','<p>Allocate your training-hours pool across skills. You can work on multiple skills every week.</p><div class="line"><strong>'+focusTotal()+' / '+game.plan.training+' assigned</strong><small>Unused hours provide no extra training</small></div>'+GROUPS[game.pos].map(g=>rang(g[1]+' ('+g[2].join(', ')+')',game.focus[g[0]],0,game.plan.training,'setFocus(\''+g[0]+'\',+this.value)','h')).join('')+'<hr>'+rang('Extra training intensity',game.extraIntensity,0,4,'setIntensity(\'extraIntensity\',+this.value)')+'<small>0 Minimal · 1 Light · 2 Moderate · 3 High · 4 Extreme</small><p class="muted">School coaching, morale, intelligence, accumulated fatigue and recovery affect efficiency. Development is applied automatically each simulated week; there are no skill points.</p>')+panel('Player attributes','<div class="grid">'+ATTRS.map(k=>'<div class="tile"><small>'+e(k)+'</small><div class="line"><strong>'+game.attrs[k]+'</strong><small>'+Math.round((game.progress[k]||0)/12*100)+'% to next</small></div><div class="meter"><i style="width:'+Math.min(100,(game.progress[k]||0)/12*100)+'%"></i></div></div>').join('')+'</div>')}
function lifeScreen(){return panel('Your life','<div class="grid">'+[['Money','$'+game.money],['Stress',Math.round(game.stress)],['Morale',Math.round(game.morale)],['Relationships',Math.round(game.relationship)],['Academic IQ',game.iq],['Behavior',game.behavior]].map(x=>'<div class="tile"><small>'+x[0]+'</small><div class="num">'+x[1]+'</div></div>').join('')+'</div><p class="muted">Morale and stress influence training, academics, and recovery efficiency. They never add or subtract available hours.</p>')+panel('Work and recurring commitments','<p>'+(game.job?'Currently employed: '+game.job.title+' · '+game.job.hours+' hours/week · $'+game.job.rate+'/hour.':'No recurring employer. Temporary gigs are always optional.')+'</p><div class="buttons"><button class="alt" onclick="gig()">One-time gig (3h)</button>'+(!game.job?'<button class="alt" onclick="offerJob(0)">Retail job · 12h/wk</button><button class="alt" onclick="offerJob(1)">Food service · 10h/wk</button><button class="alt" onclick="offerJob(2)">Landscaping · 8h/wk</button>':'<button class="outline" onclick="game.job=null;note(\'Resigned from recurring job.\');persist();render()">Quit recurring job</button>')+'</div><p class="muted">Income is paid each simulated week. Recurring hours are reserved from your weekly availability; physical jobs add to fatigue.</p>')+panel('School and expectations','<p>GPA '+game.gpa.toFixed(2)+' / 4.00. Below 2.0 places athletic eligibility at risk. More study hours improve academic preparation, depending on intelligence and stress.</p><p>Family expectation pressure: '+game.familyExpect+'/100. Major events can change relationships and morale.</p>')}
function historyScreen(){return panel('Season game log',game.games.length?game.games.map(x=>'<details><summary>Year '+x.year+' Week '+x.week+' · '+(x.win?'W':'L')+' '+x.score+'-'+x.opp+' · '+x.role+'</summary><p>'+JSON.stringify(x.stats).replace(/[{}\"]/g,'').replace(/,/g,' · ')+'</p>'+x.plays.map(t=>'<div class="log">'+e(t)+'</div>').join('')+'</details><hr>').join(''):'<p>No games played yet.</p>')+panel('Career journal',game.history.map(x=>'<div class="log"><strong>'+e(x.title)+'</strong><br>'+e(x.text)+'</div>').join(''))+panel('Save and backup','<p>Autosave is stored in this browser. Export regularly before updating GitHub Pages.</p><div class="buttons"><button onclick="exportSave()">Export Save JSON</button><label style="max-width:240px">Import saved JSON<input type="file" accept="application/json" onchange="importSave(this)"></label><button class="alt" onclick="if(confirm(\'Reset this new career? Export your save first.\')){localStorage.removeItem(KEY);game=null;render()}">New Career</button></div>')}
function render(){let el=document.getElementById('app');if(!game){el.innerHTML=setupScreen();showBudget();return}let content={career:careerScreen,team:teamScreen,develop:developScreen,life:lifeScreen,history:historyScreen};el.innerHTML=commonHeader()+content[tab]()+('<footer>Gridiron Life v0.4 · Offline, single-player prototype · Autosaved locally. Initial school rosters and rules are fictional.</footer>')}
try{let d=JSON.parse(localStorage.getItem(KEY));if(d?.version===4){game=d;schools=d.schools||schools}}catch(err){console.warn(err)}migrate();render();
</script></body></html>
