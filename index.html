template-columns:1fr 1fr;gap:10px}.action{background:#0c1b2b;border:1px solid #39506a;border-radius:12px;padding:13px}.action button{width:100%;margin-top:9px}.kbd{font-size:11px;color:#bed0e6;background:#293d54;border-radius:5px;padding:3px 6px}@media(max-width:740px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.grid2,.gameplay{grid-template-columns:1fr}.shell{padding:13px 12px 65px}.panel{padding:14px}.brand{font-size:17px}h1{font-size:25px}}
.statusline{display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between;border:1px solid #427c70;background:#122d2a;padding:12px;border-radius:12px;margin:8px 0 18px;font-size:.9rem}.statusline span{color:#a6c3be}.story{border:2px solid #dcb766!important}.story .gameplay button{white-space:normal;text-align:left}select{max-width:100%}</style></head><body><div id="root" class="shell"></div><script>
'use strict';
const KEY='gridiron-life-v01-save'; const TEAMS=['Westfield Wolves','Cedar Grove Eagles','Northside Tigers','Briarwood Bears','Lakeview Panthers','Hillside Hawks','Ridgewood Lions','Clearwater Knights'];
const BACKGROUNDS=[{id:'single',title:'Working-Class Household',desc:'Family counts on you. Extra resilience, fewer financial resources.',money:65,discipline:7,personality:1,intelligence:0,morale:0},{id:'athlete',title:'Athletic Family',desc:'Early coaching and access to equipment, but higher expectations.',money:220,discipline:4,personality:0,intelligence:3,morale:-5},{id:'wealthy',title:'Comfortable Upbringing',desc:'Resources and strong academic support; pressure to succeed.',money:350,discipline:0,personality:2,intelligence:6,morale:-2},{id:'smalltown',title:'Small-Town Star',desc:'Close community, supportive relationships, less scouting exposure.',money:115,discipline:3,personality:7,intelligence:0,morale:5},{id:'newstart',title:'Fresh Start',desc:'New school, new teammates, a chance to define yourself.',money:125,discipline:5,personality:-2,intelligence:3,morale:2}];
const POSITIONS=['WR','RB','QB','TE']; const FIRST=['Jalen','Marcus','Tyrese','Isaiah','Darius','Kendrick','Elijah','Andre','Jordan','Malik','Noah','Cam','Trent','Dante']; const LAST=['Brown','Johnson','Williams','Davis','Smith','Wilson','Jackson','Taylor','Thomas','Robinson','Harris','Walker'];
let lastFeedback='',eventTypes=['team','family','school','friend','coach'];let s=null,tab='home',pick='single',position='WR',selectedFocus='speed',revealWeek=false,draftName='Jordan Carter'; const $=q=>document.querySelector(q), clamp=(x,a,b)=>Math.min(b,Math.max(a,x)), rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a, one=a=>a[rnd(0,a.length-1)], esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function potential(x){return x>=90?'A':x>=80?'B':x>=70?'C':x>=60?'D':x>=50?'E':'F'}
function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){console.warn('Save blocked',e)}}
function log(msg){s.logs.unshift(`W${s.week}, ${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][s.day]}: ${msg}`);s.logs=s.logs.slice(0,65)}
function avg(o){return Math.round(Object.values(o).reduce((a,b)=>a+b,0)/Object.keys(o).length)}
function newPlayer(name,pos,bg){let b=BACKGROUNDS.find(v=>v.id===bg),attrs={speed:0,catching:0,routes:0,strength:0,awareness:0};let base=pos==='QB'?35:pos==='RB'?37:pos==='TE'?36:38;Object.keys(attrs).forEach(k=>attrs[k]=clamp(base+rnd(-8,9)+(k==='catching'&&pos==='WR'?5:0)+(k==='strength'&&pos==='TE'?6:0),22,60));let o=avg(attrs);return {version:1,name:name.trim().slice(0,26)||'Jordan Carter',pos,bg,school:'Westfield High',team:TEAMS[0],grade:9,week:1,day:0,season:1,energy:100,maxEnergy:100,money:b.money,gpa:2.6+b.intelligence*.04,morale:70+b.morale,coachTrust:35,friendship:25+b.personality,discipline:clamp(45+b.discipline,0,99),intelligence:clamp(50+b.intelligence+rnd(-6,6),0,99),personality:clamp(50+b.personality+rnd(-7,7),0,99),attrs,potential:rnd(72,96),talent:o,exp:0,skillPoints:0,dayActions:0,trainingToday:0,seasonGames:[],careerGames:[],history:[],logs:[],rivals:makeRivals(),won:0,lost:0,injury:0,studiedWeek:0,socialWeek:0,trainedWeek:0,offers:[],focus:'speed',started:Date.now(),fatigue:3,schedule:['speed','study','skills','social','strength','rest','rest'],autoSchedule:false,eventsSeen:[],pendingEvent:null,relationships:{teammate:45,family:70},trainingSpent:0}}

const TRAINING={speed:{name:'40-yard sprints',cost:0,energy:12,xp:[8,14],attr:'speed'},hills:{name:'Hill repeats',cost:0,energy:18,xp:[11,17],attr:'speed'},strength:{name:'Strength circuits',cost:0,energy:15,xp:[9,15],attr:'strength'},skills:{name:'Position technique',cost:0,energy:12,xp:[9,16],attr:'routes'},film:{name:'Film breakdown',cost:0,energy:7,xp:[7,13],attr:'awareness'},facility:{name:'Performance facility',cost:35,energy:13,xp:[15,23],attr:'speed'},trainer:{name:'Private position coach',cost:75,energy:12,xp:[20,30],attr:'routes'}};
const ROUTINE={speed:'Speed drills',hills:'Hill repeats',strength:'Strength',skills:'Position skills',film:'Film study',facility:'Performance facility',trainer:'Private trainer',study:'Study',social:'Socialize',work:'Part-time work',rest:'Recovery'};
const STORIES=[
 {id:'coach',title:'The coach calls you aside',body:'A varsity assistant invites you to an extra evaluation after practice. You are still a freshman and your body is adjusting to the workload.',options:[['Go to the evaluation','trust',5,'You accept the evaluation and make an impression.'],['Ask for a lighter session','recovery',5,'The coach agrees to assess you while protecting your workload.'],['Stay with your regular routine','morale',3,'You stick with the plan and feel more in control.']]},
 {id:'family',title:'A problem at home',body:'A family member needs help with an errand after school. You had planned a training session.',options:[['Help your family','family',9,'You give up some free time to help at home.'],['Offer to help tomorrow','family',3,'You find a compromise that keeps your plans intact.'],['Say you cannot help','morale',-4,'You keep your training plans but the conversation weighs on you.']]},
 {id:'team',title:'A teammate is struggling',body:'A teammate missed an assignment and is being blamed in the locker room. He asks you to help him study the playbook.',options:[['Review film together','teammate',9,'Your teammate appreciates the help.'],['Encourage him briefly','teammate',3,'You offer support without committing your evening.'],['Stay out of it','morale',0,'You decide to remain uninvolved.']]},
 {id:'school',title:'An academic warning',body:'Your teacher says your latest assignment could use a revision. There is still time before the grade closes.',options:[['Spend the evening revising','gpa',0.17,'Your revision improves your standing in class.'],['Ask for extra help','gpa',0.11,'You learn from the feedback.'],['Accept the existing grade','morale',-2,'You move on without changing the grade.']]},
 {id:'friend',title:'A friend reaches out',body:'An old friend feels you have been spending all your time around football. They invite you to hang out.',options:[['Make time for them','friend',8,'You reconnect and share a good evening.'],['Plan something for next week','friend',3,'You make a plan to catch up later.'],['Focus on football','friend',-5,'Your friend sounds disappointed.']]}
];
function initV2(){if(!s)return;s.fatigue??=3;s.schedule??=['speed','study','skills','social','strength','rest','rest'];s.autoSchedule??=false;s.eventsSeen??=[];s.pendingEvent??=null;s.relationships??={teammate:45,family:70};s.trainingSpent??=0;}
function feedback(msg){lastFeedback=msg;}
function trainingDrill(id){let d=TRAINING[id];if(!d||s.pendingEvent||s.dayActions>=3)return;if(s.money<d.cost){feedback('Not enough cash for '+d.name+'.');render();return}if(s.energy<d.energy){feedback('Not enough daily energy. Recover or advance the day.');render();return}let old=s.energy;s.money-=d.cost;s.trainingSpent+=d.cost;s.energy-=d.energy;s.dayActions++;s.trainedWeek++;s.trainingToday++;let effectiveness=clamp(1+(s.intelligence-50)/220-s.fatigue/250-(s.energy<22?.16:0),.35,1.35);let xp=Math.max(2,Math.round(rnd(...d.xp)*effectiveness));s.exp+=xp;s.fatigue=clamp(s.fatigue+(id==='hills'?2.7:id==='strength'?1.8:1.1),0,100);s.coachTrust=clamp(s.coachTrust+1,0,100);let descriptions={speed:['Worked on your first three steps and clean acceleration.','Ran timed sprints with an emphasis on stride mechanics.'],hills:['Finished uphill bursts; the final reps tested your legs.'],strength:['Worked through squats and core stability with controlled form.'],skills:['Practiced footwork and position-specific reactions.'],film:['Studied defensive looks and corrected a missed read.'],facility:['Used timing gates and coached movement drills at a performance center.'],trainer:['A private coach identified a mechanical weakness and adjusted your technique.']};let line=one(descriptions[id])+` +${xp} XP${d.cost?`, $${d.cost} spent`:''}.`;log(line);while(s.exp>=70){s.exp-=70;s.skillPoints++;log('Earned a skill point from accumulated development XP.')}feedback(`${d.name}: +${xp} XP · −${old-s.energy} energy${d.cost?' · −$'+d.cost:''} · fatigue ${Math.round(s.fatigue)}%`);save();render()}
function checkEvent(){if(s.pendingEvent||s.week>10)return;let chance=.11+(s.day===0?.05:0);if(Math.random()>chance)return;let eligible=STORIES.filter(x=>!s.eventsSeen.includes(s.season+'-'+x.id));if(!eligible.length)return;let ev=one(eligible);s.pendingEvent=ev.id;s.eventsSeen.push(s.season+'-'+ev.id);log('Story event: '+ev.title);feedback('A story event needs your decision.');}
function resolveEvent(index){let ev=STORIES.find(x=>x.id===s.pendingEvent);if(!ev)return;let choice=ev.options[index];if(!choice)return;let [label,stat,delta,desc]=choice;const mod=(field,lo=0,hi=100)=>s[field]=clamp(s[field]+delta,lo,hi);if(stat==='trust')mod('coachTrust');else if(stat==='recovery'){s.fatigue=clamp(s.fatigue-delta,0,100);s.coachTrust=clamp(s.coachTrust+1,0,100)}else if(stat==='family'||stat==='teammate'){s.relationships[stat]=clamp(s.relationships[stat]+delta,0,100)}else if(stat==='friend')mod('friendship');else if(stat==='gpa')mod('gpa',0,4);else mod('morale');s.pendingEvent=null;log(desc);feedback(desc);save();render()}
function setSchedule(day,value){s.schedule[day]=value;save();render()}
function toggleAuto(){s.autoSchedule=!s.autoSchedule;save();render()}
function applySchedule(){if(!s.autoSchedule||s.pendingEvent||s.day===5)return;let task=s.schedule[s.day];if(TRAINING[task])trainingDrill(task);else if(['study','social','work','rest'].includes(task))action(task)}
function weekSim(){if(s.pendingEvent)return;let count=0;while(count<8&&s.week<=10){if(s.day===5&&!s.seasonGames.some(g=>g.week===s.week)){latestGame=outcome();feedback(`Week ${s.week} game complete. Review your game log.`);save();render();return}if(s.day===6){dayNext();return}dayNext();count++;if(s.pendingEvent)return}render()}
function status(){return `<div class="statusline"><b>${esc(lastFeedback||'Ready for your next decision.')}</b><span>Energy ${s.energy}% · Fatigue ${Math.round(s.fatigue)}% · Cash $${s.money} · XP ${s.exp}/70</span></div>`}
function storyPanel(){let e=STORIES.find(x=>x.id===s.pendingEvent);return e?`<div class="panel story"><span class="badge">STORY DECISION · ${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][s.day]}</span><h2>${e.title}</h2><p>${e.body}</p><div class="gameplay">${e.options.map((o,i)=>`<button class="btn alt" onclick="resolveEvent(${i})">${o[0]}</button>`).join('')}</div></div>`:''}

function makeRivals(){return Array.from({length:12},(_,i)=>({name:one(FIRST)+' '+one(LAST),pos:one(POSITIONS),ovr:rnd(37,72),pot:rnd(55,95),team:one(TEAMS),progress:rnd(0,3)}))}
function ovr(){return avg(s.attrs)} function canAct(cost){return s.energy>=cost&&s.dayActions<3&&s.injury<3}
function action(type){if(!s||s.pendingEvent)return;if(type==='train'){trainingDrill(s.focus in TRAINING?s.focus:'skills');return}let cost={study:12,social:12,work:16,rest:0}[type];if(s.dayActions>=3||s.energy<cost)return;s.energy-=cost;s.dayActions++;if(type==='study'){s.studiedWeek++;let v=.065+s.intelligence/1300;s.gpa=clamp(s.gpa+v,0,4);log('Reviewed classwork and met with a study partner. GPA improved.');feedback(`Studied: GPA +${v.toFixed(2)} · −${cost} energy`)}if(type==='social'){s.socialWeek++;s.friendship=clamp(s.friendship+6,0,100);s.morale=clamp(s.morale+3,0,100);log('Spent time with friends after class.');feedback(`Friends: +6 friendship · +3 morale · −${cost} energy`)}if(type==='work'){let pay=rnd(28,44);s.money+=pay;s.morale=clamp(s.morale-1,0,100);log(`Worked an afternoon shift at a local shop. Earned $${pay}.`);feedback(`Work: +$${pay} · −${cost} energy`)}if(type==='rest'){s.energy=clamp(s.energy+30,0,100);s.fatigue=clamp(s.fatigue-2.5,0,100);s.injury=clamp(s.injury-1,0,9);log('Recovered with rest, food and extra sleep.');feedback('Recovered: +30 daily energy · −2.5 seasonal fatigue')}save();render()}

function improve(k){if(s.skillPoints<1||!s.attrs[k])return;let cap=Math.min(99,s.potential+3);if(s.attrs[k]>=cap)return; s.attrs[k]++;s.skillPoints--;log(`Increased ${k} to ${s.attrs[k]}.`);save();render()}
function dayNext(){if(!s||s.pendingEvent)return;if(s.day===5&&s.week<=10&&!s.seasonGames.some(g=>g.week===s.week)){tab='game';feedback('Saturday game is ready.');render();return}if(s.day===6){s.day=0;s.week++;s.studiedWeek=0;s.socialWeek=0;s.trainedWeek=0;if(s.week===11){finishSeason();return}}else s.day++;s.dayActions=0;s.trainingToday=0;s.energy=clamp(s.energy+52+(s.day===6?10:0),0,100);s.fatigue=clamp(s.fatigue-(s.day===6?3.5:.85),0,100);if(s.injury>0)s.injury--;s.morale=clamp(s.morale+(s.day===6?2:0),0,100);checkEvent();save();render();if(!s.pendingEvent&&s.autoSchedule)applySchedule()}

function finishSeason(){let old=s.grade;let avgG=s.seasonGames.length?Math.round(s.seasonGames.reduce((a,g)=>a+g.yards,0)/s.seasonGames.length):0;let offerGrade=ovr();if(old>=11 && offerGrade>=58 && s.gpa>=2.0){let schools=['Central State','Gulf Coast University','East Valley','Hill Country Tech','Lakefront State','North Metro'];s.offers=[...new Set([...s.offers,one(schools),...(offerGrade>64?[one(schools)]:[])])]}s.history.unshift({grade:old,record:`${s.won}-${s.lost}`,ovr:ovr(),gpa:s.gpa,avgYds:avgG,offers:[...s.offers]});s.grade++;s.season++;s.week=1;s.day=0;s.dayActions=0;s.energy=100;s.injury=0;s.won=0;s.lost=0;s.coachTrust=clamp(s.coachTrust+5,0,100);s.seasonGames=[];s.gpa=clamp(s.gpa-.25,0,4);s.rivals.forEach(r=>r.ovr=clamp(r.ovr+rnd(1,5),0,r.pot));if(s.grade>12){s.grade=12;s.week=11;log(`High school complete! Career prototype ends here. ${s.offers.length?'College interest: '+s.offers.join(', '):'Keep developing your player.'}`)}else{log(`New school year: Grade ${s.grade}. Last season averaged ${avgG} yards. Continue your career.`)}tab='home';save();render()}
function outcome(){let w=s.week,opponent=TEAMS[w%TEAMS.length];if(opponent===s.team)opponent=TEAMS[(w+1)%TEAMS.length];let oppRating=clamp(43+w*1.2+rnd(-7,7),35,75),rating=ovr();let share=clamp(.18+(rating-oppRating)/170+(s.coachTrust-50)/350,.06,.45);let plays=s.pos==='QB'?rnd(22,34):s.pos==='RB'?rnd(24,40):rnd(19,32);let chances=Math.max(1,Math.round(plays*share*(s.injury>0?.7:1)));let decisions=[],rec=0,yards=0,td=0,attempts=0,completions=0;let chanceBase=clamp(.48+(rating-oppRating)/180+(s.morale-50)/500-s.fatigue/400,.22,.84);for(let i=0;i<chances;i++){let success=Math.random()<chanceBase,yd=0,score=false,type=s.pos==='QB'?'pass':s.pos==='RB'?'rush':'target';if(s.pos==='RB'){yd=success?rnd(1,clamp(Math.round(16+(rating-oppRating)/6),5,24)):rnd(-3,1);rec++;}else if(s.pos==='QB'){attempts++;if(success){yd=rnd(4,clamp(Math.round(25+(rating-oppRating)/6),8,34));completions++;rec++;}}else if(success){yd=rnd(3,clamp(Math.round(25+(rating-oppRating)/5),8,38));rec++;}yards+=yd;let scoringChance=success&&yd>0?.045+yd/550:0;score=Math.random()<scoringChance;if(score)td++;decisions.push({type,ok:success,yd,td:score,description:s.pos==='QB'?(success?`Completed pass for ${yd} yards`:'Pass incomplete'):s.pos==='RB'?`Rush ${yd>=0?'+':''}${yd} yards`:(success?`Reception +${yd} yards`:'Target incomplete / defended')})}let teamPoints=clamp(Math.round(12+rnd(0,22)+(rating-oppRating)/8+td*3),0,55),oppPoints=clamp(Math.round(15+rnd(0,24)+(oppRating-48)/6),0,55);if(teamPoints===oppPoints)teamPoints+=3;teamPoints=Math.max(teamPoints,td*6);let win=teamPoints>oppPoints,xp=Math.round(7+rec*2+td*7+(win?7:0));s.exp+=xp;s.coachTrust=clamp(s.coachTrust+(rec>=3?3:rec===0?-1:1)+(win?1:0),0,100);s.morale=clamp(s.morale+(win?4:-3),0,100);s.energy=clamp(s.energy-17,0,100);s.fatigue=clamp(s.fatigue+2.4+chances*.12,0,100);let risk=.003+Math.pow(s.fatigue/100,2)*.12+(s.energy<22?.02:0);if(Math.random()<risk){s.injury=rnd(2,5);log('You picked up a minor injury during the game. Recovery is necessary.')}s.gpa=clamp(s.gpa-(s.studiedWeek===0?.10:.025),0,4);s.won+=win?1:0;s.lost+=win?0:1;while(s.exp>=70){s.exp-=70;s.skillPoints++}let game={week:w,opponent,teamPoints,oppPoints,win,rating,oppRating,chances,rec,yards,td,xp,decisions,share:Math.round(share*100),attempts,completions};s.seasonGames.push(game);s.careerGames.push(game);s.dayActions=3;log(`${win?'Beat':'Lost to'} ${opponent} ${teamPoints}-${oppPoints}; ${s.pos==='QB'?completions+' completions on '+attempts+' attempts':rec+(s.pos==='RB'?' carries':' receptions')}, ${yards} yards, ${td} TD.`);save();return game}

let latestGame=null;
function play(){if(s.day!==5||s.week>10||s.seasonGames.some(g=>g.week===s.week))return;latestGame=outcome();revealWeek=true;render()}
function reset(){if(confirm('Delete this career and start again? This cannot be undone.')){localStorage.removeItem(KEY);s=null;latestGame=null;tab='home';render()}}
function start(){let name=$('#playerName').value; if(!name.trim())name='Jordan Carter';s=newPlayer(name,position,pick);log(`Started freshman year as a ${s.pos} at ${s.school}.`);save();render()}
function pageTop(){return `<div class="top"><div><div class="brand">🏈 GRIDIRON LIFE <span class="badge">v0.2</span></div><div class="sub">PLAYER CAREER · NO TIMERS · NO MICROTRANSACTIONS</div></div>${s?`<div class="split"><span class="pill">Grade ${s.grade} · Week ${s.week}</span><button class="btn ghost mini" onclick="reset()">New save</button></div>`:'<span class="pill">Prototype</span>'}</div>`}
function creation(){return `${pageTop()}<div class="panel"><div class="layout-head"><div><h1>Make your story.</h1><p class="muted">Start as a high school freshman. Your background changes your resources and early opportunities, not your potential to succeed.</p></div><span class="trophy">🏟️</span></div><div class="grid2"><label class="formfield">Player name<input id="playerName" maxlength="26" placeholder="Jordan Carter" value="${esc(draftName)}" oninput="draftName=this.value"></label><label class="formfield">Position<select id="pos" onchange="position=this.value">${POSITIONS.map(x=>`<option ${position===x?'selected':''}>${x}</option>`).join('')}</select></label></div><h3>Choose your background</h3><div class="grid2">${BACKGROUNDS.map(b=>`<button class="choice ${pick===b.id?'selected':''}" onclick="pick='${b.id}';render()"><b>${b.title}</b><small>${b.desc}</small></button>`).join('')}</div><div class="result"><b>Design rules</b><p class="mini muted">One universal 0–99 overall across high school, college, and pro football. Hidden precise potential; visible A–F grade. You make off-field decisions; games are simulated for the whole team, not designed to throw you the ball every play.</p></div><button class="btn" style="width:100%" onclick="start()">Start Player Career →</button></div><div class="foot">Offline prototype · browser saves use local storage on this device</div>`}
function metrics(){return `<div class="stats"><div class="stat"><small>OVERALL</small><strong>${ovr()}</strong><small>${s.pos} · HS</small></div><div class="stat"><small>POTENTIAL</small><strong class="gold">${potential(s.potential)}</strong><small>Scouted projection</small></div><div class="stat"><small>INTELLIGENCE</small><strong>${s.intelligence}</strong><small>Learning ability</small></div><div class="stat"><small>PERSONALITY</small><strong>${s.personality}</strong><small>Social influence</small></div></div>`}
function header(){return `<div class="layout-head"><div><h1>${esc(s.name)}</h1><div class="muted">${s.pos} · ${s.school} · ${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][s.day]} · Grade ${s.grade}</div></div><span class="pill">${s.won} W / ${s.lost} L</span></div>${metrics()}`}
function nav(){return `<div class="tabs">${[['home','Dashboard'],['schedule','Daily life'],['train','Development'],['game','Game day'],['league','League'],['career','Career']].map(([k,l])=>`<button class="tab ${tab===k?'active':''}" onclick="tab='${k}';render()">${l}</button>`).join('')}</div>`}
function rail(){return `<div class="panel"><h2>Life & readiness</h2>${[['Energy',s.energy,100],['Morale',s.morale,100],['Coach trust',s.coachTrust,100],['Friendship',s.friendship,100],['GPA',s.gpa,4],['Development XP',s.exp,70],['Season fatigue',s.fatigue,100]].map(([label,n,max])=>`<div class="metric"><span>${label}</span><b>${typeof n==='number'&&max===4?n.toFixed(2):n}${max===100?'%':''}</b></div><div class="bar"><div class="fill" style="width:${clamp(n/max*100,0,100)}%"></div></div>`).join('')}<div class="metric"><span>Cash</span><b>$${s.money}</b></div><div class="metric"><span>Skill points</span><b class="gold">${s.skillPoints}</b></div><p class="info">Actions this day: ${s.dayActions}/3 · You can advance days freely.</p><div class="metric"><span>Family connection</span><b>${s.relationships.family}%</b></div><div class="metric"><span>Teammate bond</span><b>${s.relationships.teammate}%</b></div><h3>Recent activity</h3><div class="log">${s.logs.slice(0,8).map(x=>`<div>${esc(x)}</div>`).join('')}</div></div>`}
function dashboard(){let next=TEAMS[s.week%TEAMS.length];return `<div class="panel"><h2>Career dashboard</h2><p class="muted">${s.grade===12&&s.week===11?'High school career complete. Review your career stats.':`It's ${['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][s.day]} of Week ${s.week}. Manage your time, improve your player, and prepare for Saturday football.`}</p><div class="grid2"><div class="result"><b>Upcoming matchup</b><p>${s.team} vs ${next}</p><span class="badge">${s.week<=10?'Week '+s.week+' · Saturday':'Season finished'}</span></div><div class="result"><b>Season performance</b><p>${s.seasonGames.length} games · ${s.seasonGames.reduce((a,g)=>a+g.yards,0)} yards · ${s.seasonGames.reduce((a,g)=>a+g.td,0)} TD</p><span class="badge">${s.won}-${s.lost} record</span></div></div><div class="notice">${s.day===5&&!s.seasonGames.some(g=>g.week===s.week)?'It is game day! Open the Game day tab to simulate your matchup.':'Your player is not guaranteed the ball. Teammates and opponents perform independently in the simulated game.'}</div><h3>Quick actions</h3><div class="buttonrow"><button class="btn" onclick="tab='schedule';render()">Manage day</button><button class="btn alt" onclick="tab='train';render()">Develop skills</button><button class="btn alt" onclick="tab='game';render()">Game day</button></div></div>`}
function schedule(){return `<div class="panel"><h2>Daily life</h2>${status()}<p class="muted">Choose actions manually, or build an automatic weekly routine. Significant RPG events pause the routine.</p><div class="buttonrow"><button class="btn alt" onclick="toggleAuto()">Automatic schedule: ${s.autoSchedule?'ON':'OFF'}</button><button class="btn" onclick="weekSim()" ${s.pendingEvent?'disabled':''}>Advance toward next game →</button></div><h3>Weekly activity plan</h3><div class="gameplay">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map((day,i)=>`<div class="action"><b>${day}${i===5?' · Game day':''}</b><select ${i===5?'disabled':''} onchange="setSchedule(${i},this.value)">${Object.entries(ROUTINE).map(([k,label])=>`<option value="${k}" ${s.schedule[i]===k?'selected':''}>${label}</option>`).join('')}</select></div>`).join('')}</div><h3>Make a decision now</h3><div class="gameplay">${[['study','Study','Improve GPA'],['social','See friends','Develop relationships'],['work','Work a shift','Earn money for equipment, facilities or trainers'],['rest','Recover','Restore energy and lower accumulated fatigue']].map(([k,n,desc])=>`<div class="action"><b>${n}</b><p class="mini muted">${desc}</p><button class="btn alt" onclick="action('${k}')" ${s.dayActions>=3||s.pendingEvent?'disabled':''}>Choose</button></div>`).join('')}</div><div class="split" style="margin-top:15px"><button class="btn" onclick="dayNext()" ${s.pendingEvent?'disabled':''}>${s.day===5?'Go to game':'Next day'} →</button><span class="mini muted">${s.dayActions}/3 actions today</span></div></div>`}

function training(){return `<div class="panel"><h2>Player development</h2>${status()}<p class="muted">Specific drills produce variable results. Paid coaching increases development efficiency; free training remains useful. Potential sets long-term expectations, not guaranteed outcomes.</p><div class="stats">${Object.entries(s.attrs).map(([k,v])=>`<div class="stat"><small>${k.toUpperCase()}</small><strong>${v}</strong><button class="btn alt mini" onclick="improve('${k}')" ${s.skillPoints<1?'disabled':''}>+1 skill</button></div>`).join('')}</div><h3>Training options</h3><div class="gameplay">${Object.entries(TRAINING).map(([id,d])=>`<div class="action"><b>${d.name}</b><p class="mini muted">${d.xp[0]}–${d.xp[1]} base XP · ${d.energy} energy · ${d.cost?'$'+d.cost:'Free'}</p><button class="btn alt" onclick="trainingDrill('${id}')" ${s.dayActions>=3||s.money<d.cost||s.pendingEvent?'disabled':''}>Train</button></div>`).join('')}</div><div class="result"><b>Development</b><div class="bar"><div class="fill" style="width:${s.exp/70*100}%"></div></div><p>${s.exp}/70 XP · ${s.skillPoints} available skill points</p></div></div>`}

function gameview(){let g=s.seasonGames.find(g=>g.week===s.week),played=!!g;return `<div class="panel"><h2>Saturday football</h2>${status()}<p class="muted">${s.team} vs ${TEAMS[s.week%TEAMS.length]} · Week ${s.week}</p>${s.week>10?'<div class="notice">Season complete. Advance to the next school year.</div>':s.day!==5&&!played?`<div class="result">The game is on Saturday. Advance through the calendar.</div>`:!played?`<div class="result"><h3>Ready for kickoff?</h3><p>Your team plays independently. Your opportunities depend on coaching trust, ability and opponents.</p><button class="btn" onclick="play()">Simulate full game</button></div>`:''}${played?`<div class="result"><div class="score">${s.team} ${g.teamPoints} – ${g.oppPoints} ${esc(g.opponent)}</div><p class="${g.win?'green':'red'}"><b>${g.win?'VICTORY':'DEFEAT'}</b> · ${s.pos==='QB'?`${g.completions??g.rec}/${g.attempts??g.chances} passing`:g.rec+(s.pos==='RB'?' carries':' receptions')} · ${g.yards} yards · ${g.td} TD · ${g.xp} XP</p><p class="mini muted">${g.chances} player opportunities · ${g.share}% share · ${g.rating} OVR vs ${g.oppRating} opponent</p></div><h3>Every player opportunity</h3><div class="log">${g.decisions.map((d,i)=>`<div>${i+1}. ${d.description||((d.ok?'+':'')+d.yd+' yards')}${d.td?' · TOUCHDOWN!':''}</div>`).join('')}</div><p class="info">Audit: ${g.decisions.reduce((a,d)=>a+(d.yd||0),0)} yards and ${g.decisions.filter(d=>d.td).length} TD from these plays.</p>`:''}<div class="notice">v0.2 simulates each of your opportunities first, then sums the statistics from exactly those plays. A complete drive/clock engine remains a future upgrade.</div></div>`}

function league(){return `<div class="panel"><h2>League & rivals</h2><p class="muted">Other players have their own overall ratings and potential. Rival talent develops when seasons progress.</p><table class="standings"><thead><tr><th>Player</th><th>Team</th><th>OVR</th><th>POT</th></tr></thead><tbody><tr><td><b>${esc(s.name)}</b></td><td>${esc(s.team)}</td><td>${ovr()}</td><td>${potential(s.potential)}</td></tr>${[...s.rivals].sort((a,b)=>b.ovr-a.ovr).map(r=>`<tr><td>${esc(r.name)} <span class="info">${r.pos}</span></td><td>${esc(r.team)}</td><td>${r.ovr}</td><td>${potential(r.pot)}</td></tr>`).join('')}</tbody></table><p class="info">Potential letters are broad projections. They do not reveal the exact underlying ceiling.</p></div>`}
function career(){let sum=s.careerGames;return `<div class="panel"><h2>Career history</h2><p class="muted">Your journey through high school. College and professional chapters are planned for later versions.</p><div class="stats"><div class="stat"><small>GAMES</small><strong>${sum.length}</strong></div><div class="stat"><small>YARDS</small><strong>${sum.reduce((a,g)=>a+g.yards,0)}</strong></div><div class="stat"><small>TOUCHDOWNS</small><strong>${sum.reduce((a,g)=>a+g.td,0)}</strong></div><div class="stat"><small>GRADE</small><strong>${s.grade}</strong></div></div><h3>College offers</h3><div class="result">${s.offers.length?s.offers.map(x=>`<span class="badge" style="margin-right:5px">${esc(x)}</span>`).join(''):'No offers yet. Perform well, develop your talent and maintain your GPA.'}</div><h3>Completed seasons</h3>${s.history.length?s.history.map(h=>`<div class="item"><div><b>Grade ${h.grade}</b><br><small>${h.record} · ${h.avgYds} avg yards/game · GPA ${h.gpa.toFixed(2)}</small></div><b>${h.ovr} OVR</b></div>`).join(''):'<p class="muted">No completed seasons yet.</p>'}<h3>Recent games</h3>${[...sum].reverse().slice(0,12).map(g=>`<div class="item"><div><b>${g.win?'W':'L'} ${g.teamPoints}-${g.oppPoints}</b> vs ${esc(g.opponent)}<br><small>${g.rec} ${s.pos==='WR'||s.pos==='TE'?'receptions':'plays'} · ${g.yards} yards · ${g.td} TD</small></div><span class="badge">W${g.week}</span></div>`).join('')||'<p class="muted">Your first game is coming soon.</p>'}</div>`}
function render(){initV2();const root=$('#root');if(!s){root.innerHTML=creation();return}root.innerHTML=`${pageTop()}${nav()}${header()}${storyPanel()}<div style="height:14px"></div><div class="grid"><main>${{home:dashboard,schedule,train:training,game:gameview,league,career}[tab]()}</main>${rail()}</div><div class="foot">GRIDIRON LIFE · TEST BUILD v0.2 · Data saved locally in this browser · No purchases or waiting</div>`}
try{let data=localStorage.getItem(KEY);if(data){let parsed=JSON.parse(data);if(parsed?.version===1&&parsed.attrs&&parsed.logs)s=parsed}}catch(e){console.warn(e)}render();
</script></body></html>
