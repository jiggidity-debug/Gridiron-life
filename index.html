<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c1421"><title>Gridiron Life — Player Career v0.1</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0a111d;color:#eef2fa;font-synthesis:none}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1a2b42,#0a111d 75%);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.38;cursor:not-allowed}.shell{max-width:1100px;margin:auto;padding:18px 18px 90px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:17px}.brand{font-weight:900;letter-spacing:.09em;color:#f8c95b;font-size:20px}.sub{font-size:12px;color:#a9bacd}.pill{border:1px solid #44556a;border-radius:999px;padding:6px 10px;color:#bdd3e8;font-size:12px}.panel{background:#152235;border:1px solid #30445c;border-radius:17px;padding:18px;box-shadow:0 12px 35px #0002}.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(270px,.85fr);gap:16px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.stat{background:#0d192a;border-radius:12px;padding:12px;min-width:0}.stat strong{font-size:23px;display:block}.stat small{font-size:11px;color:#91a8bd}.tabs{display:flex;gap:7px;overflow-x:auto;margin-bottom:15px;padding-bottom:4px}.tab{white-space:nowrap;background:#152235;border:1px solid #30445c;color:#bed0e4;padding:10px 15px;border-radius:11px}.tab.active{background:#e9b953;color:#101824;border-color:#e9b953;font-weight:800}.muted{color:#a3b5ca}.gold{color:#ffcf6c}.green{color:#78dfb1}.red{color:#ff9e9e}h1{font-size:30px;margin:0 0 6px}h2{font-size:19px;margin:0 0 10px}h3{font-size:15px;margin:14px 0 8px}p{line-height:1.5;margin:8px 0 12px}.btn{border:0;border-radius:11px;padding:11px 14px;background:#ebbb55;color:#152033;font-weight:800}.btn.alt{background:#2a3f59;color:#eef2fa}.btn.ghost{background:transparent;border:1px solid #60738a;color:#d1deeb}.btn.danger{background:#71363c;color:#fff}.buttonrow{display:flex;flex-wrap:wrap;gap:8px}.choice{background:#0e1b2d;color:#e9f2ff;border:1px solid #344c65;text-align:left;padding:14px;border-radius:12px;width:100%}.choice.selected{border:2px solid #f6c965;background:#24354a}.choice b{display:block;margin-bottom:3px}.choice small{color:#a8bad0;line-height:1.5}.list{display:flex;flex-direction:column;gap:9px}.item{padding:12px;background:#0d1b2b;border:1px solid #263b52;border-radius:11px;display:flex;align-items:center;justify-content:space-between;gap:10px}.item>div{min-width:0}.item small{color:#a1b5c9}.log{max-height:290px;overflow:auto;display:flex;flex-direction:column;gap:8px}.log div{background:#0d1b2d;padding:9px;border-left:3px solid #d9ae5c;border-radius:5px;font-size:13px}.bar{height:7px;background:#0a1623;border-radius:10px;overflow:hidden;margin-top:6px}.fill{height:100%;background:#d8b35a}.layout-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:15px;flex-wrap:wrap}.formfield{display:flex;flex-direction:column;gap:5px;color:#adbed1;font-size:13px}input,select{background:#0d1b2e;border:1px solid #435a72;border-radius:10px;color:#fff;padding:12px;width:100%}.badge{font-size:12px;padding:3px 8px;border-radius:8px;background:#2f455d;color:#e0ebfa}.result{background:#0e1b2c;border:1px solid #364a60;border-radius:12px;padding:14px;margin:12px 0}.score{font-size:27px;font-weight:900}.info{font-size:12px;color:#8aa3b8}.hide{display:none!important}.metric{display:flex;align-items:center;justify-content:space-between;gap:15px;font-size:13px;margin-top:9px}.foot{margin-top:30px;text-align:center;font-size:11px;color:#6f859d}.mini{font-size:12px}.split{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.trophy{font-size:42px}.notice{padding:10px;background:#253b51;border-radius:9px;font-size:13px}.standings{width:100%;border-collapse:collapse;font-size:13px}.standings th,.standings td{text-align:left;border-bottom:1px solid #30445c;padding:9px 5px}.standings th{color:#9eb5c9}.gameplay{display:grid;grid-template-columns:1fr 1fr;gap:10px}.action{background:#0c1b2b;border:1px solid #39506a;border-radius:12px;padding:13px}.action button{width:100%;margin-top:9px}.kbd{font-size:11px;color:#bed0e6;background:#293d54;border-radius:5px;padding:3px 6px}@media(max-width:740px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.grid2,.gameplay{grid-template-columns:1fr}.shell{padding:13px 12px 65px}.panel{padding:14px}.brand{font-size:17px}h1{font-size:25px}}
</style></head><body><div id="root" class="shell"></div><script>
'use strict';
const KEY='gridiron-life-v01-save'; const TEAMS=['Westfield Wolves','Cedar Grove Eagles','Northside Tigers','Briarwood Bears','Lakeview Panthers','Hillside Hawks','Ridgewood Lions','Clearwater Knights'];
const BACKGROUNDS=[{id:'single',title:'Working-Class Household',desc:'Family counts on you. Extra resilience, fewer financial resources.',money:65,discipline:7,personality:1,intelligence:0,morale:0},{id:'athlete',title:'Athletic Family',desc:'Early coaching and access to equipment, but higher expectations.',money:220,discipline:4,personality:0,intelligence:3,morale:-5},{id:'wealthy',title:'Comfortable Upbringing',desc:'Resources and strong academic support; pressure to succeed.',money:350,discipline:0,personality:2,intelligence:6,morale:-2},{id:'smalltown',title:'Small-Town Star',desc:'Close community, supportive relationships, less scouting exposure.',money:115,discipline:3,personality:7,intelligence:0,morale:5},{id:'newstart',title:'Fresh Start',desc:'New school, new teammates, a chance to define yourself.',money:125,discipline:5,personality:-2,intelligence:3,morale:2}];
const POSITIONS=['WR','RB','QB','TE']; const FIRST=['Jalen','Marcus','Tyrese','Isaiah','Darius','Kendrick','Elijah','Andre','Jordan','Malik','Noah','Cam','Trent','Dante']; const LAST=['Brown','Johnson','Williams','Davis','Smith','Wilson','Jackson','Taylor','Thomas','Robinson','Harris','Walker'];
let s=null,tab='home',pick='single',position='WR',selectedFocus='speed',revealWeek=false,draftName='Jordan Carter'; const $=q=>document.querySelector(q), clamp=(x,a,b)=>Math.min(b,Math.max(a,x)), rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a, one=a=>a[rnd(0,a.length-1)], esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function potential(x){return x>=90?'A':x>=80?'B':x>=70?'C':x>=60?'D':x>=50?'E':'F'}
function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){console.warn('Save blocked',e)}}
function log(msg){s.logs.unshift(`W${s.week}, ${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][s.day]}: ${msg}`);s.logs=s.logs.slice(0,65)}
function avg(o){return Math.round(Object.values(o).reduce((a,b)=>a+b,0)/Object.keys(o).length)}
function newPlayer(name,pos,bg){let b=BACKGROUNDS.find(v=>v.id===bg),attrs={speed:0,catching:0,routes:0,strength:0,awareness:0};let base=pos==='QB'?35:pos==='RB'?37:pos==='TE'?36:38;Object.keys(attrs).forEach(k=>attrs[k]=clamp(base+rnd(-8,9)+(k==='catching'&&pos==='WR'?5:0)+(k==='strength'&&pos==='TE'?6:0),22,60));let o=avg(attrs);return {version:1,name:name.trim().slice(0,26)||'Jordan Carter',pos,bg,school:'Westfield High',team:TEAMS[0],grade:9,week:1,day:0,season:1,energy:100,maxEnergy:100,money:b.money,gpa:2.6+b.intelligence*.04,morale:70+b.morale,coachTrust:35,friendship:25+b.personality,discipline:clamp(45+b.discipline,0,99),intelligence:clamp(50+b.intelligence+rnd(-6,6),0,99),personality:clamp(50+b.personality+rnd(-7,7),0,99),attrs,potential:rnd(72,96),talent:o,exp:0,skillPoints:0,dayActions:0,trainingToday:0,seasonGames:[],careerGames:[],history:[],logs:[],rivals:makeRivals(),won:0,lost:0,injury:0,studiedWeek:0,socialWeek:0,trainedWeek:0,offers:[],focus:'speed',started:Date.now()}}
function makeRivals(){return Array.from({length:12},(_,i)=>({name:one(FIRST)+' '+one(LAST),pos:one(POSITIONS),ovr:rnd(37,72),pot:rnd(55,95),team:one(TEAMS),progress:rnd(0,3)}))}
function ovr(){return avg(s.attrs)} function canAct(cost){return s.energy>=cost&&s.dayActions<3&&s.injury<3}
function action(type){if(!s)return;let cost={train:25,study:18,social:18,work:22,rest:0}[type]; if(type!=='rest'&&!canAct(cost))return; if(type==='train') {s.energy-=25;s.trainingToday++;s.trainedWeek++;s.dayActions++;let gain=1+(s.discipline>=60?1:0)+rnd(0,1);s.exp+=gain*9;s.morale=clamp(s.morale-2,0,100);s.coachTrust=clamp(s.coachTrust+1,0,100);if(s.trainingToday>=2&&Math.random()<.15){s.injury=2;log('Overtraining caused soreness; you need recovery.')}else log(`Finished ${s.focus} drills. +${gain*9} development XP.`);if(s.exp>=70){s.skillPoints++;s.exp-=70;log('Earned 1 skill point. Spend it on the Training tab.')}}
if(type==='study'){s.energy-=18;s.dayActions++;s.studiedWeek++;let v=.08+s.intelligence/1000;s.gpa=clamp(s.gpa+v,0,4);log('Studied and improved your GPA.')}if(type==='social'){s.energy-=18;s.dayActions++;s.socialWeek++;s.friendship=clamp(s.friendship+7,0,100);s.morale=clamp(s.morale+6,0,100);log('Spent time with friends. Friendship and morale increased.')}if(type==='work'){s.energy-=22;s.dayActions++;s.money+=rnd(22,38);s.morale=clamp(s.morale-2,0,100);log('Worked a shift and earned some money.')}if(type==='rest'){if(s.dayActions>=3)return;s.dayActions++;s.energy=clamp(s.energy+35,0,100);s.injury=clamp(s.injury-1,0,9);s.morale=clamp(s.morale+3,0,100);log('Rested and recovered energy.')}save();render()}
function improve(k){if(s.skillPoints<1||!s.attrs[k])return;let cap=Math.min(99,s.potential+3);if(s.attrs[k]>=cap)return; s.attrs[k]++;s.skillPoints--;log(`Increased ${k} to ${s.attrs[k]}.`);save();render()}
function dayNext(){if(!s)return;if(s.day===5 && s.week<=10 && !s.seasonGames.some(g=>g.week===s.week)){tab='game';render();return}if(s.day===6){s.day=0;s.week++;s.studiedWeek=0;s.socialWeek=0;s.trainedWeek=0;if(s.week===11){finishSeason();return}}else{s.day++}s.dayActions=0;s.trainingToday=0;s.energy=clamp(s.energy+31+(s.day===6?20:0),0,100);s.morale=clamp(s.morale+(s.day===6?2:0),0,100);if(s.injury>0)s.injury--;if(Math.random()<.10&&s.day!==5){let event=one(['A teammate asks you to join an extra practice.','A teacher praises your focus in class.','A local reporter mentions the football program.','Your family checks in on how school is going.']);log(event)}save();render()}
function finishSeason(){let old=s.grade;let avgG=s.seasonGames.length?Math.round(s.seasonGames.reduce((a,g)=>a+g.yards,0)/s.seasonGames.length):0;let offerGrade=ovr();if(old>=11 && offerGrade>=58 && s.gpa>=2.0){let schools=['Central State','Gulf Coast University','East Valley','Hill Country Tech','Lakefront State','North Metro'];s.offers=[...new Set([...s.offers,one(schools),...(offerGrade>64?[one(schools)]:[])])]}s.history.unshift({grade:old,record:`${s.won}-${s.lost}`,ovr:ovr(),gpa:s.gpa,avgYds:avgG,offers:[...s.offers]});s.grade++;s.season++;s.week=1;s.day=0;s.dayActions=0;s.energy=100;s.injury=0;s.won=0;s.lost=0;s.coachTrust=clamp(s.coachTrust+5,0,100);s.seasonGames=[];s.gpa=clamp(s.gpa-.25,0,4);s.rivals.forEach(r=>r.ovr=clamp(r.ovr+rnd(1,5),0,r.pot));if(s.grade>12){s.grade=12;s.week=11;log(`High school complete! Career prototype ends here. ${s.offers.length?'College interest: '+s.offers.join(', '):'Keep developing your player.'}`)}else{log(`New school year: Grade ${s.grade}. Last season averaged ${avgG} yards. Continue your career.`)}tab='home';save();render()}
function outcome(){let w=s.week;let opponent=TEAMS[w%TEAMS.length];if(opponent===s.team)opponent=TEAMS[(w+1)%TEAMS.length];let rivalRating=clamp(42+w*2+rnd(-7,8),35,76);let r=ovr();let talentGap=(r-rivalRating)/22;let share=clamp(.15+talentGap*.09+(s.coachTrust-50)/350, .045, .38);let injuries=s.injury>0?.7:1;let opportunities=s.pos==='QB'?rnd(18,31):s.pos==='RB'?rnd(26,43):rnd(19,35);let chances=Math.round(opportunities*share*injuries);let rec=0,yards=0,td=0;let decisions=[];for(let i=0;i<chances;i++){let chance=clamp(.38+(r-rivalRating)/160+s.attrs.awareness/450+s.morale/800, .18,.84);let ok=Math.random()<chance;let yd=ok?rnd(3,Math.max(8,Math.round(24+(s.attrs.speed-rivalRating)/4))):0;if(ok){rec++;yards+=yd;if(Math.random()<.06+yd/550)td++}decisions.push({ok,yd})}if(s.pos==='QB'){rec=Math.round(rnd(12,23)*clamp(.75+(r-rivalRating)/90,.45,1.18));yards=rec*rnd(7,14);td=rnd(0,4)}else if(s.pos==='RB'){rec=Math.round(chances*.8);yards=Math.round(rnd(32,98)*clamp(1+(r-rivalRating)/65,.5,1.7));td=rnd(0,1)+(yards>140?1:0)}let teamPoints=clamp(Math.round(14+rnd(0,20)+(r-rivalRating)/6+td*2),0,58);let oppPoints=clamp(Math.round(15+rnd(0,26)+(rivalRating-50)/5),0,55);if(teamPoints===oppPoints)teamPoints+=3;let win=teamPoints>oppPoints;let xp=Math.round(8+rec*2+td*6+(win?8:0));s.exp+=xp;s.coachTrust=clamp(s.coachTrust+(rec>=3?4:rec===0?-3:1)+(win?1:0),0,100);s.morale=clamp(s.morale+(win?5:-4),0,100);s.energy=clamp(s.energy-12,0,100);s.gpa=clamp(s.gpa-(s.studiedWeek===0?.16:.035),0,4);s.won+=win?1:0;s.lost+=win?0:1;while(s.exp>=70){s.exp-=70;s.skillPoints++}let game={week:w,opponent,teamPoints,oppPoints,win,rating:r,oppRating:rivalRating,chances,rec,yards,td,xp,decisions,share:Math.round(share*100)};s.seasonGames.push(game);s.careerGames.push(game);s.dayActions=3;log(`${win?'Beat':'Lost to'} ${opponent} ${teamPoints}-${oppPoints}. ${s.pos==='QB'?'Completions':s.pos==='RB'?'Carries':'Catches'}: ${rec}, yards: ${yards}, TD: ${td}.`);save();return game}
let latestGame=null;
function play(){if(s.day!==5||s.week>10||s.seasonGames.some(g=>g.week===s.week))return;latestGame=outcome();revealWeek=true;render()}
function reset(){if(confirm('Delete this career and start again? This cannot be undone.')){localStorage.removeItem(KEY);s=null;latestGame=null;tab='home';render()}}
function start(){let name=$('#playerName').value; if(!name.trim())name='Jordan Carter';s=newPlayer(name,position,pick);log(`Started freshman year as a ${s.pos} at ${s.school}.`);save();render()}
function pageTop(){return `<div class="top"><div><div class="brand">🏈 GRIDIRON LIFE <span class="badge">v0.1</span></div><div class="sub">PLAYER CAREER · NO TIMERS · NO MICROTRANSACTIONS</div></div>${s?`<div class="split"><span class="pill">Grade ${s.grade} · Week ${s.week}</span><button class="btn ghost mini" onclick="reset()">New save</button></div>`:'<span class="pill">Prototype</span>'}</div>`}
function creation(){return `${pageTop()}<div class="panel"><div class="layout-head"><div><h1>Make your story.</h1><p class="muted">Start as a high school freshman. Your background changes your resources and early opportunities, not your potential to succeed.</p></div><span class="trophy">🏟️</span></div><div class="grid2"><label class="formfield">Player name<input id="playerName" maxlength="26" placeholder="Jordan Carter" value="${esc(draftName)}" oninput="draftName=this.value"></label><label class="formfield">Position<select id="pos" onchange="position=this.value">${POSITIONS.map(x=>`<option ${position===x?'selected':''}>${x}</option>`).join('')}</select></label></div><h3>Choose your background</h3><div class="grid2">${BACKGROUNDS.map(b=>`<button class="choice ${pick===b.id?'selected':''}" onclick="pick='${b.id}';render()"><b>${b.title}</b><small>${b.desc}</small></button>`).join('')}</div><div class="result"><b>Design rules</b><p class="mini muted">One universal 0–99 overall across high school, college, and pro football. Hidden precise potential; visible A–F grade. You make off-field decisions; games are simulated for the whole team, not designed to throw you the ball every play.</p></div><button class="btn" style="width:100%" onclick="start()">Start Player Career →</button></div><div class="foot">Offline prototype · browser saves use local storage on this device</div>`}
function metrics(){return `<div class="stats"><div class="stat"><small>OVERALL</small><strong>${ovr()}</strong><small>${s.pos} · HS</small></div><div class="stat"><small>POTENTIAL</small><strong class="gold">${potential(s.potential)}</strong><small>Scouted projection</small></div><div class="stat"><small>INTELLIGENCE</small><strong>${s.intelligence}</strong><small>Learning ability</small></div><div class="stat"><small>PERSONALITY</small><strong>${s.personality}</strong><small>Social influence</small></div></div>`}
function header(){return `<div class="layout-head"><div><h1>${esc(s.name)}</h1><div class="muted">${s.pos} · ${s.school} · ${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][s.day]} · Grade ${s.grade}</div></div><span class="pill">${s.won} W / ${s.lost} L</span></div>${metrics()}`}
function nav(){return `<div class="tabs">${[['home','Dashboard'],['schedule','Daily life'],['train','Development'],['game','Game day'],['league','League'],['career','Career']].map(([k,l])=>`<button class="tab ${tab===k?'active':''}" onclick="tab='${k}';render()">${l}</button>`).join('')}</div>`}
function rail(){return `<div class="panel"><h2>Life & readiness</h2>${[['Energy',s.energy,100],['Morale',s.morale,100],['Coach trust',s.coachTrust,100],['Friendship',s.friendship,100],['GPA',s.gpa,4],['Development XP',s.exp,70]].map(([label,n,max])=>`<div class="metric"><span>${label}</span><b>${typeof n==='number'&&max===4?n.toFixed(2):n}${max===100?'%':''}</b></div><div class="bar"><div class="fill" style="width:${clamp(n/max*100,0,100)}%"></div></div>`).join('')}<div class="metric"><span>Cash</span><b>$${s.money}</b></div><div class="metric"><span>Skill points</span><b class="gold">${s.skillPoints}</b></div><p class="info">Actions this day: ${s.dayActions}/3 · You can advance days freely.</p><h3>Recent activity</h3><div class="log">${s.logs.slice(0,8).map(x=>`<div>${esc(x)}</div>`).join('')}</div></div>`}
function dashboard(){let next=TEAMS[s.week%TEAMS.length];return `<div class="panel"><h2>Career dashboard</h2><p class="muted">${s.grade===12&&s.week===11?'High school career complete. Review your career stats.':`It's ${['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][s.day]} of Week ${s.week}. Manage your time, improve your player, and prepare for Saturday football.`}</p><div class="grid2"><div class="result"><b>Upcoming matchup</b><p>${s.team} vs ${next}</p><span class="badge">${s.week<=10?'Week '+s.week+' · Saturday':'Season finished'}</span></div><div class="result"><b>Season performance</b><p>${s.seasonGames.length} games · ${s.seasonGames.reduce((a,g)=>a+g.yards,0)} yards · ${s.seasonGames.reduce((a,g)=>a+g.td,0)} TD</p><span class="badge">${s.won}-${s.lost} record</span></div></div><div class="notice">${s.day===5&&!s.seasonGames.some(g=>g.week===s.week)?'It is game day! Open the Game day tab to simulate your matchup.':'Your player is not guaranteed the ball. Teammates and opponents perform independently in the simulated game.'}</div><h3>Quick actions</h3><div class="buttonrow"><button class="btn" onclick="tab='schedule';render()">Manage day</button><button class="btn alt" onclick="tab='train';render()">Develop skills</button><button class="btn alt" onclick="tab='game';render()">Game day</button></div></div>`}
function schedule(){let actionList=[['train','Football practice','25 energy','Improve development XP and coach trust'],['study','Study','18 energy','Raise GPA and eligibility'],['social','Spend time with friends','18 energy','Boost friendship and morale'],['work','Part-time job','22 energy','Earn money with an energy cost'],['rest','Recover','1 action','Restore energy and reduce soreness']];return `<div class="panel"><h2>Daily life</h2><p class="muted">Choose up to three activities each day. Energy recovers when you advance the calendar. There is no real-world timer.</p><div class="gameplay">${actionList.map(([key,title,cost,desc])=>`<div class="action"><b>${title}</b><p class="mini muted">${desc}</p><span class="kbd">${cost}</span><button class="btn alt" ${s.dayActions>=3||key!=='rest'&&!canAct({train:25,study:18,social:18,work:22}[key])?'disabled':''} onclick="action('${key}')">Do activity</button></div>`).join('')}</div><hr style="border-color:#334a61;margin:18px 0"><div class="split"><button class="btn" onclick="dayNext()">${s.day===5&&!s.seasonGames.some(g=>g.week===s.week)?'Go to game day':'Advance to next day'} →</button><span class="muted mini">${s.dayActions}/3 activities used today</span></div></div>`}
function training(){return `<div class="panel"><h2>Player development</h2><p class="muted">Training earns XP, and each 70 XP gives you one skill point. Spend points to raise individual attributes. Your potential grade is a broad long-term projection, not a guaranteed outcome.</p><div class="stats">${Object.entries(s.attrs).map(([k,v])=>`<div class="stat"><small>${k.toUpperCase()}</small><strong>${v}</strong><button class="btn alt mini" onclick="improve('${k}')" ${s.skillPoints<1?'disabled':''}>+1 skill</button></div>`).join('')}</div><h3>Choose a practice focus</h3><div class="buttonrow">${Object.keys(s.attrs).map(k=>`<button class="btn ${s.focus===k?'':'alt'}" onclick="s.focus='${k}';save();render()">${k}</button>`).join('')}</div><p class="info">Training focus is for your practice log. Skill points are assigned manually, letting you develop your chosen build.</p><div class="result"><b>Development</b><div class="bar"><div class="fill" style="width:${s.exp/70*100}%"></div></div><p class="mini">${s.exp}/70 XP · ${s.skillPoints} unspent skill points</p></div></div>`}
function gameview(){let game=latestGame&&latestGame.week===s.week?latestGame:s.seasonGames.find(g=>g.week===s.week),played=!!s.seasonGames.find(g=>g.week===s.week);return `<div class="panel"><h2>Saturday football</h2><p class="muted">${s.team} vs ${TEAMS[s.week%TEAMS.length]} · Week ${s.week}</p>${s.week>10?'<div class="notice">Season completed. Advance the calendar to start the next school year.</div>':s.day!==5&&!played?`<div class="result">Game day is Saturday. It's currently ${['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][s.day]}. Advance days on the Daily life tab.</div>`:!played?`<div class="result"><h3>Ready for kickoff?</h3><p>Your position, ratings, coaching trust, opponent strength, and a little randomness shape your opportunities. Other players receive the ball too.</p><button class="btn" onclick="play()">Simulate full game</button></div>`:''}${played?`<div class="result"><div class="score">${s.team} ${game.teamPoints} – ${game.oppPoints} ${esc(game.opponent)}</div><p class="${game.win?'green':'red'}"><b>${game.win?'VICTORY':'DEFEAT'}</b> · ${s.pos==='QB'?'Completions':s.pos==='RB'?'Carries':'Receptions'}: ${game.rec} · ${game.yards} yards · ${game.td} TD · ${game.xp} XP</p><p class="mini muted">Your OVR ${game.rating} · Opponent strength ${game.oppRating} · ${game.chances} opportunities · ~${game.share}% of relevant team plays</p></div><h3>Play-by-play (your opportunities)</h3><div class="log">${game.decisions?.length?game.decisions.map((d,i)=>`<div>Opportunity ${i+1}: ${d.ok?`+${d.yd} yards`:'Incomplete / defended'}</div>`).join(''):'<div>Team simulation generated your final stat line.</div>'}</div>`:''}<div class="notice" style="margin-top:12px">The first version uses a simplified statistical engine, not animated routes or a complete drive-by-drive football engine. The QB does not automatically target your receiver.</div></div>`}
function league(){return `<div class="panel"><h2>League & rivals</h2><p class="muted">Other players have their own overall ratings and potential. Rival talent develops when seasons progress.</p><table class="standings"><thead><tr><th>Player</th><th>Team</th><th>OVR</th><th>POT</th></tr></thead><tbody><tr><td><b>${esc(s.name)}</b></td><td>${esc(s.team)}</td><td>${ovr()}</td><td>${potential(s.potential)}</td></tr>${[...s.rivals].sort((a,b)=>b.ovr-a.ovr).map(r=>`<tr><td>${esc(r.name)} <span class="info">${r.pos}</span></td><td>${esc(r.team)}</td><td>${r.ovr}</td><td>${potential(r.pot)}</td></tr>`).join('')}</tbody></table><p class="info">Potential letters are broad projections. They do not reveal the exact underlying ceiling.</p></div>`}
function career(){let sum=s.careerGames;return `<div class="panel"><h2>Career history</h2><p class="muted">Your journey through high school. College and professional chapters are planned for later versions.</p><div class="stats"><div class="stat"><small>GAMES</small><strong>${sum.length}</strong></div><div class="stat"><small>YARDS</small><strong>${sum.reduce((a,g)=>a+g.yards,0)}</strong></div><div class="stat"><small>TOUCHDOWNS</small><strong>${sum.reduce((a,g)=>a+g.td,0)}</strong></div><div class="stat"><small>GRADE</small><strong>${s.grade}</strong></div></div><h3>College offers</h3><div class="result">${s.offers.length?s.offers.map(x=>`<span class="badge" style="margin-right:5px">${esc(x)}</span>`).join(''):'No offers yet. Perform well, develop your talent and maintain your GPA.'}</div><h3>Completed seasons</h3>${s.history.length?s.history.map(h=>`<div class="item"><div><b>Grade ${h.grade}</b><br><small>${h.record} · ${h.avgYds} avg yards/game · GPA ${h.gpa.toFixed(2)}</small></div><b>${h.ovr} OVR</b></div>`).join(''):'<p class="muted">No completed seasons yet.</p>'}<h3>Recent games</h3>${[...sum].reverse().slice(0,12).map(g=>`<div class="item"><div><b>${g.win?'W':'L'} ${g.teamPoints}-${g.oppPoints}</b> vs ${esc(g.opponent)}<br><small>${g.rec} ${s.pos==='WR'||s.pos==='TE'?'receptions':'plays'} · ${g.yards} yards · ${g.td} TD</small></div><span class="badge">W${g.week}</span></div>`).join('')||'<p class="muted">Your first game is coming soon.</p>'}</div>`}
function render(){const root=$('#root');if(!s){root.innerHTML=creation();return}root.innerHTML=`${pageTop()}${nav()}${header()}<div style="height:14px"></div><div class="grid"><main>${{home:dashboard,schedule,train:training,game:gameview,league,career}[tab]()}</main>${rail()}</div><div class="foot">GRIDIRON LIFE · TEST BUILD v0.1 · Data saved locally in this browser · No purchases or waiting</div>`}
try{let data=localStorage.getItem(KEY);if(data){let parsed=JSON.parse(data);if(parsed?.version===1&&parsed.attrs&&parsed.logs)s=parsed}}catch(e){console.warn(e)}render();
</script></body></html>
